<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Engineering playbook">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12091F"/>
      <stop offset="1" stop-color="#2A0F3D"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2E88"/>
      <stop offset="1" stop-color="#FCAF17"/>
    </linearGradient>
    <linearGradient id="neonLine" gradientUnits="userSpaceOnUse" x1="760" y1="0" x2="1120" y2="0">
      <stop offset="0" stop-color="#FF2E88"/>
      <stop offset="1" stop-color="#FCAF17"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FF2E88" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- flux : petits commits qui partent en production -->
  <g stroke="url(#neonLine)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M760 200 H1120"/>
    <path d="M820 200 C840 200 850 140 880 140 H960 C990 140 1000 200 1020 200"/>
  </g>
  <g fill="#12091F" stroke-width="3">
    <circle cx="790" cy="200" r="9" stroke="#FF2E88"/>
    <circle cx="880" cy="140" r="9" stroke="#FF5FA0"/>
    <circle cx="920" cy="140" r="9" stroke="#FF7A6A"/>
    <circle cx="960" cy="140" r="9" stroke="#FF9440"/>
    <circle cx="1060" cy="200" r="9" stroke="#FCAF17"/>
  </g>
  <circle cx="1120" cy="200" r="13" fill="#FCAF17" filter="url(#glow)"/>
  <text x="1120" y="236" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#FCAF17" letter-spacing="2">PROD</text>

  <text x="70" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#FFFFFF">Engineering</text>
  <text x="70" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="url(#neon)" filter="url(#glow)">playbook</text>
  <text x="72" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#C9B8DA">Livrer souvent, tester juste, décider par écrit.</text>
</svg>
